services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: heliteb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       heliteb
      POSTGRES_USER:     heliteb_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Heliteb2026!}"
    ports:
      - "5433:5432"
    volumes:
      - heliteb_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heliteb_user -d heliteb"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: heliteb_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - heliteb_ollama:/root/.ollama

  heliteb-api:
    build:
      context: ./backend-dotnet
      dockerfile: Heliteb.Api/Dockerfile
    container_name: heliteb_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=heliteb;Username=heliteb_user;Password=${POSTGRES_PASSWORD:-Heliteb2026!}"
      Ollama__BaseUrl: "http://ollama:11434"
      Embeddings__Provider: "${EMBEDDINGS_PROVIDER:-ollama}"
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      DeepSeek__ApiKey: "${DEEPSEEK_API_KEY}"
      Groq__ApiKey: "${GROQ_API_KEY}"
      InboxCrm__ApiKey: "${INBOXCRM_API_KEY}"
      Kommo__ChannelSecret: "${KOMMO_CHANNEL_SECRET}"
      Webhook__KommoSharedSecret: "${KOMMO_WEBHOOK_SHARED_SECRET}"
      Webhook__N8nSyncSecret: "${N8N_SYNC_SECRET}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      # Origen(es) del panel permitidos por CORS (separados por coma si hay más
      # de uno). El valor por defecto coincide con el panel local vía Docker;
      # en producción, .env define el dominio real (ver .env.example).
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:4321}"
    ports:
      - "5090:8080"
    volumes:
      # Solo lectura - para que el monitoreo de recursos (RAM/disco) vea el disco real
      # del servidor y no solo la capa del contenedor. Si esta ruta no existe (ej.
      # Windows en desarrollo local), el codigo cae a leer "/" del propio contenedor.
      - /:/hostfs:ro
    depends_on:
      postgres:
        condition: service_healthy

  heliteb-panel:
    build:
      # Panel Astro + React (ver Front/README.md), build estático servido por
      # nginx - habla con el API .NET directo desde el navegador del usuario, no
      # server-side, así que no necesita JWT_SIGNING_KEY ni ninguna variable de
      # entorno en runtime (todo lo que necesita se incrusta en el JS al buildear).
      context: ./Front
      args:
        # Debe ser una URL alcanzable por el NAVEGADOR del usuario (el puerto
        # publicado en el host), nunca el nombre interno de red de Docker -
        # Astro incrusta este valor en el JS del cliente durante el build, no
        # lo lee en runtime dentro del contenedor.
        PUBLIC_API_URL: "${PUBLIC_PANEL_API_URL:-http://localhost:5090}"
    container_name: heliteb_panel
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      - heliteb-api

# Sin pgAdmin: la administración de Postgres se hace con un cliente externo
# (DBeaver, etc.) contra el puerto 5433 publicado arriba - un pgAdmin propio
# sería otro contenedor y otro puerto expuesto sin usar.

# No trae Caddy propio: el host de producción ya corre un reverse proxy
# compartido para varios proyectos (ver Caddyfile en este repo, pensado para
# fusionarse con el Caddyfile que ya exista - agrega bloques para PANEL_DOMAIN
# y API_DOMAIN apuntando a host.docker.internal:4321 / :5090, los puertos que
# heliteb-panel/heliteb-api ya publican en el host). En un servidor limpio sin
# proxy propio, ese mismo Caddyfile se puede correr suelto con
# `docker run -p 80:80 -p 443:443 -v ./Caddyfile:/etc/caddy/Caddyfile caddy:2-alpine`.

volumes:
  heliteb_pgdata:
  heliteb_ollama:
