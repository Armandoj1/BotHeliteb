# Astro's static build emits directory-style routes (/compare/index.html), so a
# request for /compare must fall back to /compare/index.html — the default
# `=404` fallback would otherwise 404 every route except the literal file.
server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, el redirect automático de directorio (/login -> /login/) sale
    # como URL absoluta usando el puerto/esquema INTERNO de nginx (http://.../
    # :4321), no el dominio público por HTTPS del reverse proxy de enfrente -
    # rompe CORS y termina en un puerto que ni siquiera debería ser público.
    absolute_redirect off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fingerprinted build assets never change content under the same name —
    # safe to cache aggressively, unlike the HTML shell above.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
