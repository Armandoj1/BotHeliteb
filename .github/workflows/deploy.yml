name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Sin esto, dos despliegues que se solapan (un push seguido rápido de otro, o
# uno automático chocando con uno corrido a mano en el servidor) pueden pelear
# por recrear el mismo contenedor a la vez y Docker se confunde con el nombre
# temporal que usa durante el recreate - ya pasó una vez. En cola, nunca en
# paralelo ni cancelando uno a medias (podría cortar el respaldo de Postgres).
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH al VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/heliteb
            bash scripts/deploy.sh
